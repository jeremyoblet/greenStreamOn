<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stream saver</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Oswald:wght@700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="container">
      <h1 class="logo-title">
        <span class="text-white">GreenStream</span
        ><span class="text-green">ON</span>
      </h1>

      <div class="tabs">
        <button class="tab-button" data-tab="login">Login</button>
        <button class="tab-button active" data-tab="stats">Stats</button>
        <button class="tab-button" data-tab="settings">Settings</button>
      </div>

      <div class="tab-content" id="tab-login">
        <!-- Login Form (shown when logged out) -->
        <div class="login-form" id="loginFormContainer">
          <div class="form-group">
            <label for="loginEmail" class="form-label">Email</label>
            <input type="email" id="loginEmail" class="form-input" placeholder="email@example.com" />
          </div>
          <div class="form-group">
            <label for="loginPassword" class="form-label">Password</label>
            <input type="password" id="loginPassword" class="form-input" placeholder="********" />
          </div>
          <div class="login-error" id="loginError"></div>
          <button id="loginButton" class="login-button">Login</button>
          <div class="register-link">
            <span>No account?</span>
            <a href="https://www.greenstreamon.com" target="_blank">Sign up</a>
          </div>
        </div>

        <!-- User Profile (shown when logged in) -->
        <div class="user-profile" id="userProfileContainer" style="display: none;">
          <div class="profile-header">
            <div class="avatar-container">
              <img id="userAvatar" class="user-avatar" src="" alt="Avatar" />
              <div class="avatar-level-badge" id="avatarLevelBadge">1</div>
            </div>
            <div class="user-info">
              <span class="user-name" id="userName">Username</span>
              <div class="user-level">
                <span class="level-icon">&#9733;</span>
                <span class="level-text" id="userLevelText">Digital Seed</span>
              </div>
            </div>
          </div>
          <div class="profile-stats">
            <div class="profile-stat">
              <span class="stat-value" id="profileBandwidth">0.00</span>
              <span class="stat-label">Mo saved</span>
            </div>
            <div class="profile-stat-divider"></div>
            <div class="profile-stat">
              <span class="stat-value" id="profileLevel">1</span>
              <span class="stat-label">Level</span>
            </div>
          </div>
          <button id="logoutButton" class="logout-button">
            <span class="logout-icon">&#10148;</span>
            Logout
          </button>
        </div>
      </div>

      <div class="tab-content active" id="tab-stats">
        <div class="savings-counters">
          <div class="counter-line">
            <span id="ecoPlayTime">0:00:00</span> eco play time
          </div>
          <div class="counter-line">
            <span id="bandwidthSaved">0.00</span> Mo Bandwidth saved
          </div>
          <div class="counter-line">
            <span id="co2Saved">0.00</span> gCO₂e saved
          </div>
        </div>

        <div class="achievements-section">
          <div class="achievements-header">Achievements</div>
          <div class="achievements-list" id="achievementsList">
            <div class="achievement-item placeholder">
              <div class="achievement-icon"></div>
            </div>
            <div class="achievement-item placeholder">
              <div class="achievement-icon"></div>
            </div>
            <div class="achievement-item placeholder">
              <div class="achievement-icon"></div>
            </div>
            <div class="achievement-item placeholder">
              <div class="achievement-icon"></div>
            </div>
            <div class="achievement-item placeholder">
              <div class="achievement-icon"></div>
            </div>
          </div>
        </div>

        <div class="level-progress">
          <div class="level-header">
            <span class="level-label">Next level</span>
            <span class="level-title" id="levelTitle">Seedling</span>
          </div>
          <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
          </div>
          <div class="progress-text">
            <span id="progressCurrent">0.00</span> / <span id="progressGoal">10</span> Mo
          </div>
        </div>
      </div>

      <div class="tab-content" id="tab-settings">
        <div class="option-card">
          <div class="option-line">
            <label for="extensionEnabled" class="option-label">Enabled</label>
            <label class="switch">
              <input type="checkbox" id="extensionEnabled" />
              <span class="slider"></span>
            </label>
          </div>
        </div>

        <div class="option-card">
          <div class="option-line">
            <label for="hiddenQuality" class="option-label">Min quality</label>
            <select id="hiddenQuality">
              <option value="Auto">Auto</option>
              <option value="144">144p</option>
              <option value="240">240p</option>
              <option value="360">360p</option>
              <option value="480">480p</option>
              <option value="720">720p</option>
              <option value="1080">1080p</option>
              <option value="1080hdpremium">1080pPremiumHD</option>
              <option value="1440">1440p</option>
              <option value="1440hdpremium">1440pPremiumHD</option>
              <option value="2160">2160p</option>
              <option value="2160hdpremium">2160pPremiumHD</option>
              <option value="4320">4320p</option>
              <option value="4320hdpremium">4320pPremiumHD</option>
            </select>
          </div>

          <div class="option-line">
            <label for="visibleQuality" class="option-label">Max quality</label>
            <select id="visibleQuality">
              <option value="Auto">Auto</option>
              <option value="144">144p</option>
              <option value="240">240p</option>
              <option value="360">360p</option>
              <option value="480">480p</option>
              <option value="720">720p</option>
              <option value="1080">1080p</option>
              <option value="1080hdpremium">1080pPremiumHD</option>
              <option value="1440">1440p</option>
              <option value="1440hdpremium">1440pPremiumHD</option>
              <option value="2160">2160p</option>
              <option value="2160hdpremium">2160pPremiumHD</option>
              <option value="4320">4320p</option>
              <option value="4320hdpremium">4320pPremiumHD</option>
            </select>
          </div>
        </div>

        <div class="option-card">
          <div class="option-line">
            <label for="notificationsEnabled" class="option-label"
              >Notifications</label
            >
            <label class="switch">
              <input type="checkbox" id="notificationsEnabled" />
              <span class="slider"></span>
            </label>
          </div>
        </div>

        <div class="option-card">
          <div class="option-line">
            <label for="pauseModeEnabled" class="option-label">Pause mode</label>
            <label class="switch">
              <input type="checkbox" id="pauseModeEnabled" />
              <span class="slider"></span>
            </label>
          </div>
        </div>
      </div>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
